name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            base_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-main\.' | head -n 1 || true)
            base="${base_tag#v}"
            base="${base:-0.0.0}"
            tag="v${base}-main.${GITHUB_SHA:0:7}"
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build signed release
        working-directory: mobile
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew --no-daemon test lint assembleRelease \
            -Pkumadroid.versionName="$RELEASE_VERSION" \
            -Pkumadroid.versionCode="${GITHUB_RUN_NUMBER}"

      - name: Verify APK signature
        run: |
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs mobile/app/build/outputs/apk/release/app-release.apk

      - name: Stage release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp mobile/app/build/outputs/apk/release/app-release.apk "dist/kumadroid-${RELEASE_VERSION}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KumaDroid ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/kumadroid-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'legacy' }}
